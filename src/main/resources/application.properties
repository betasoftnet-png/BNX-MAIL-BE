# ===================================================================
# BNXmail Backend - Application Configuration
# ===================================================================

# Server
server.port=${PORT:8080}

# Database Configuration (Overrides via SPRING_DATASOURCE_* env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mail_app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mailuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:StrongPassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:default-jwt-secret-key-min-32-chars-long-bnxmail}
jwt.expiration=${JWT_EXPIRATION:900000}

# External SMTP Configuration (Forgot Password Email OTP)
spring.mail.host=${SPRING_MAIL_HOST:${mail.smtp.host:${SMTP_HOST:}}}
spring.mail.port=${SPRING_MAIL_PORT:${mail.smtp.port:${SMTP_PORT:587}}}
spring.mail.username=${SPRING_MAIL_USERNAME:${mail.smtp.username:${SMTP_USERNAME:}}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${mail.smtp.password:${SMTP_PASSWORD:}}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:${SPRING_MAIL_AUTH:${mail.smtp.auth:${SMTP_AUTH:true}}}}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:${SPRING_MAIL_STARTTLS_ENABLE:${SPRING_MAIL_STARTTLS:${mail.smtp.starttls.enable:${SMTP_STARTTLS:true}}}}}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:${SPRING_MAIL_SSL_ENABLE:${SPRING_MAIL_SSL:${mail.smtp.ssl.enable:${SMTP_SSL:false}}}}}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST:${SMTP_SSL_TRUST:*}}
spring.mail.protocol=${SPRING_MAIL_PROTOCOL:smtp}
mail.from=${SPRING_MAIL_FROM:${MAIL_FROM:${spring.mail.username:${SPRING_MAIL_USERNAME:noreply@bnxmail.com}}}}

# Internal Mail Delivery (Local Postfix & Dovecot)
mail.smtp.host=${LOCAL_SMTP_HOST:localhost}
mail.smtp.port=${LOCAL_SMTP_PORT:25}
mail.imap.host=${LOCAL_IMAP_HOST:localhost}
mail.imap.port=${LOCAL_IMAP_PORT:143}

# SMS Provider (MSG91 Phone OTP)
sms.provider.authkey=${SMS_PROVIDER_AUTHKEY:${sms.auth.key:}}
sms.provider.templateId=${SMS_PROVIDER_TEMPLATEID:${sms.template.id:}}
sms.provider.forgotPasswordTemplateId=${SMS_PROVIDER_FORGOTPASSWORDTEMPLATEID:${sms.forgot.password.template.id:}}
sms.provider.senderId=${SMS_PROVIDER_SENDERID:${sms.sender.id:BNXML}}
